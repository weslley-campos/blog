name: 🔄 Pull Request
on:
  push:
    branches:
      - main

env:
  REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
  IMAGE_NAME: ${{ forgejo.repository }}/blog-web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: ☕️ Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 💾 Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 📦 Web build
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace

      - name: 📤 Upload web dist
        if: (!cancelled())
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: web-dist-${{ forgejo.sha }}
          path: composeApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: 🐳 Deploy docker image
    needs: build
    runs-on: ubuntu-latest

    concurrency:
      group: web-deploy
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 📥 Download web dist
        uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          name: web-dist-${{ forgejo.sha }}
          path: dist

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🏷️ Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=

      - name: 🔐 Login to Forgejo Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ forgejo.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: 🚀 Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: 🔔 Trigger Arcane redeploy
        run: curl -fsS -X POST "${{ secrets.ARCANE_WEBHOOK_URL }}"
