naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: [ 'Composable', 'Test' ]
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][A-Za-z0-9_]*'
  MatchingDeclarationName:
    active: false
    excludes: ['**/expect/*', '**/actual/*']

complexity:
  LongMethod:
    active: false
  LongParameterList:
    active: false
  NamedArguments:
    active: true

style:
  DestructuringDeclarationWithTooManyEntries:
    active: false
  ForbiddenComment:
    allowedPatterns: 'TODO:'
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreLocalVariableDeclaration: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

formatting:
  EnumWrapping:
    active: true
  IfElseBracing:
    active: true
  NoBlankLineInList:
    active: true
  Filename:
    active: true
    excludes:
      - '**/composeApp/src/wasmJsMain/kotlin/**/main.kt'

exceptions:
  TooGenericExceptionCaught:
    active: false
