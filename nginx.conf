server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Standard MIME map. Includes application/wasm since nginx 1.21.0, so no
    # explicit override needed. Don't replace this with a server-level types{}
    # block — that *replaces* rather than *extends*, and HTML/JS/CSS would all
    # fall back to default_type (octet-stream).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # Hashed assets — safe to cache forever.
    location ~* \.(js|mjs|wasm|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Entry HTML must always re-validate so a deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
