server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Standard MIME map. Includes application/wasm since nginx 1.21.0, so no
    # explicit override needed. Don't replace this with a server-level types{}
    # block — that *replaces* rather than *extends*, and HTML/JS/CSS would all
    # fall back to default_type (octet-stream).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # Security headers must be repeated in every location block: nginx's
    # add_header inheritance is "all or nothing" — any add_header inside a
    # location voids ALL add_header from the parent (server) context. Stash
    # them in a snippet to keep the policy in one place.
    #
    # No CSP yet — Compose Wasm needs careful enumeration of script-src and
    # wasm-eval, add once measured against a working build.

    # In Compose Wasm output, ONLY *.wasm filenames are content-hashed
    # (e.g., 80c517d51dc6d9cff8bf.wasm). Everything else — wasmApp.js,
    # index.html, styles.css, composeResources/* — keeps the same filename
    # across builds while its contents change, so caching them as immutable
    # produces stale-asset 404s after redeploy.
    location ~* \.wasm$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # Everything else must revalidate so a redeploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
